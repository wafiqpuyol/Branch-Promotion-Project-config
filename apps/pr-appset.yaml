apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: branch-promotional-project-pr-previews
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - pullRequest:
        github:
          owner: wafiqpuyol
          repo: Branch-Promotion-Project-App
          tokenRef:
            secretName: branch-promotion-project-app-github-token
            key: token
          labels:
            - preview
        requeueAfterSeconds: 120
  template:
    metadata:
      name: 'branch-promotion-project-web-pr-{{.number}}' # <4>
      labels:
        previews.argocd.argoproj.io/enabled: "true"
    spec:
      project: default
      source:
        repoURL: https://github.com/wafiqpuyol/Branch-Promotion-Project-config.git
        targetRevision: HEAD
        path: overlays/pr
        kustomize:
          # Tell argocd that this namespace field is Git Resource. So, after merge this also get deleted
          #  When a PR is opened, Kustomize dynamically renames pr-preview to branch-promotional-project-pr-{{.number}}. Because Argo CD now tracks the Namespace object as a managed resource belonging to the PR Application, merging your PR (which deletes the Application) will automatically delete both the app resources AND the
          namespace: 'branch-promotional-project-pr-{{.number}}'
          images:
            - 'wafiqhossain/preview-env:pr-{{.number}}'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: 'branch-promotional-project-pr-{{.number}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true